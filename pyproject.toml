[project]
name = "codeimg"
version = "0.1.0"
description = "Pass rate lost when a coding task's repository context is given to a VLM as images"
readme = "README.md"
# the graders run on the DevEval venv (3.9); generation and the other stages run on 3.12
requires-python = ">=3.9"
dependencies = ["pillow>=10"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codeimg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["benchmarks", "model_panel", "pilot", "scratch"]

[tool.ruff.lint.per-file-ignores]
# code moved from benchmarks/, which tests/test_grade.py holds to the calibration code (the DevEval
# grader's loop is ours, but its run_item and splice are still the calibration's)
"src/codeimg/grade/*" = ["ALL"]
"src/codeimg/answers/coderujb.py" = ["ALL"]
"src/codeimg/answers/deveval.py" = ["ALL"]
